<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | NOVA</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">NOVA<span>.</span></a>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="products.html">Shop</a><a class="active" href="contact.html">Contact</a></nav>
    <a class="cart-link" href="cart.html">Bag <span class="cart-count">0</span></a>
  </header>
  <main class="page-main contact-main">
    <div class="page-title"><p class="eyebrow">WE’RE HERE TO HELP</p><h1>Get in touch</h1><p>Have a question? Send us a message using the form.</p></div>
    <form id="contact-form" class="contact-form">
      <label for="contact-name">Your name</label><input id="contact-name" name="name" type="text" placeholder="Enter your name" required>
      <label for="contact-email">Email address</label><input id="contact-email" name="email" type="email" placeholder="name@example.com" required>
      <label for="contact-message">Message</label><textarea id="contact-message" name="message" rows="5" placeholder="How can we help?" required></textarea>
      <button class="button" type="submit">Send message <span>→</span></button>
      <p id="contact-feedback" class="form-feedback" role="status"></p>
    </form>
  </main>
  <footer><a class="logo footer-logo" href="index.html">NOVA<span>.</span></a><p>Good things, chosen for you.</p><small>© 2026 NOVA. Student web programming project.</small></footer>
</body>
</html>
